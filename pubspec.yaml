name: expensetracker
description: "A complete mobile application for tracking personal expenses and budgets."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.1
  intl: ^0.20.2
  provider: ^6.1.2
  fl_chart: ^1.1.1
  shared_preferences: ^2.5.3
  flutter_svg: ^2.0.17
  sqflite_common_ffi: ^2.3.4
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.3.3
  cloud_firestore: ^7.2.0
  firebase_storage: ^14.1.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256

flutter_native_splash:
  color: "#087F5B"
  image: "assets/images/splash_logo.png"
  color_dark: "#065F44"
  image_dark: "assets/images/splash_logo.png"
  android_12:
    image: "assets/images/splash_logo.png"
    color: "#087F5B"
    color_dark: "#065F44"
  android: true
  ios: true
  web: false
